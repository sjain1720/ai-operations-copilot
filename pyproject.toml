[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operations-copilot"
version = "0.1.0"
description = "Backend service for an AI-powered operations copilot."
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "google-genai>=1.0,<3.0",
]

[tool.setuptools]
packages = []